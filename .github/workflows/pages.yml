name: GitHub Pages yayını

# main dalına her gönderimde oyunu yayına alır.
# configure-pages adımındaki "enablement: true", depo ayarlarında Pages kapalıysa
# onu kendiliğinden açar — Settings ekranına girmeye gerek kalmaz.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  yayinla:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.yayin.outputs.page_url }}
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Pages'i yapılandır (kapalıysa aç)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Dosyaları paketle
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Yayına al
        id: yayin
        uses: actions/deploy-pages@v4
